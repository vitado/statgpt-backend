name: Scheduled security scan

# Pilot caller on the fork: manual runs only, the schedule is added when rolled out upstream.
on:
  workflow_dispatch: {}

concurrency:
  group: trivy-scheduled
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  scan:
    uses: vitado/ai-dial-ci/.github/workflows/trivy_scheduled.yml@pilot/trivy-scheduled
    with:
      upstream-repository: epam/statgpt-backend
      images: |
        epam/statgpt-chat-backend
        epam/statgpt-admin-backend
